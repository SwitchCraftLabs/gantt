<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gantt Chart</title>
    <link rel="stylesheet" href="src/main.css" />
  </head>
  <body>
    <main>
      <h2>Procedural Gantt Chart</h2>
      <div id="gantt" class="gantt"></div>
      <hr />
      <h2>Manual Gantt Chart</h2>
      <div class="gantt">
        <div class="years">
          <div class="year">2026</div>
          <div class="year">2027</div>
        </div>
        <div class="quarters">
          <div class="quarter">Q1</div>
          <div class="quarter">Q2</div>
          <div class="quarter">Q3</div>
          <div class="quarter">Q4</div>
          <div class="quarter">Q1</div>
          <div class="quarter">Q2</div>
          <div class="quarter">Q3</div>
          <div class="quarter">Q4</div>
        </div>
        <div class="months">
          <div class="month">Jan</div>
          <div class="month">Feb</div>
          <div class="month">Mar</div>
          <div class="month">Apr</div>
          <div class="month">May</div>
          <div class="month">Jun</div>
          <div class="month">Jul</div>
          <div class="month">Aug</div>
          <div class="month">Sep</div>
          <div class="month">Oct</div>
          <div class="month">Nov</div>
          <div class="month">Dec</div>
          <div class="month">Jan</div>
          <div class="month">Feb</div>
          <div class="month">Mar</div>
          <div class="month">Apr</div>
          <div class="month">May</div>
          <div class="month">Jun</div>
          <div class="month">Jul</div>
          <div class="month">Aug</div>
          <div class="month">Sep</div>
          <div class="month">Oct</div>
          <div class="month">Nov</div>
          <div class="month">Dec</div>
        </div>
        <div class="row">
          <div class="item" style="grid-column: 3/7; background-color: purple; color: white">
            My awesome item
          </div>
        </div>
        <div class="row">
          <div class="item" style="grid-column: 1/5; background-color: green; color: white">
            An incredible idea
          </div>
        </div>
        <div class="row">
          <div class="item" style="grid-column: 6/13; background-color: orangered; color: white">
            Get REKT
          </div>
        </div>
        <div class="row">
          <div class="item" style="grid-column: 10/20; background-color: magenta; color: white">
            You can still get REKT
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="src/main.ts"></script>
</html>
